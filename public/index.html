<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Go-LeGo | 접근성 길찾기 Agent</title>
  <link rel="stylesheet" href="/css/agent.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Agent 메뉴">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">G</div>
        <div>
          <strong>Go-LeGo</strong>
          <span>Accessibility Agent</span>
        </div>
      </div>

      <button class="new-chat" id="newChat" type="button">
        <span aria-hidden="true">＋</span>
        새 대화
      </button>

      <div class="sidebar-section">
        <p class="sidebar-label">오늘의 예시</p>
        <button class="history-item" data-question="정보문화관 장애인 화장실 어디 있어?">
          <span>◌</span>
          정보문화관 화장실
        </button>
        <button class="history-item" data-question="본관에서 정보문화관까지 휠체어로 가는 길">
          <span>◌</span>
          휠체어 경로 찾기
        </button>
        <button class="history-item" data-question="본관 엘리베이터 알려줘">
          <span>◌</span>
          본관 엘리베이터
        </button>
      </div>

      <div class="sidebar-bottom">
        <div class="trust-note">
          <span class="trust-icon">✓</span>
          <div>
            <strong>근거 기반 안내</strong>
            <p>확인되지 않은 위치는 임의로 만들지 않습니다.</p>
          </div>
        </div>
      </div>
    </aside>

    <main class="chat-app">
      <header class="chat-header">
        <div class="agent-title">
          <div class="agent-avatar" aria-hidden="true">G</div>
          <div>
            <h1>고르고</h1>
            <p>접근성 길찾기 Agent</p>
          </div>
          <span class="online-dot" title="Agent 상태"></span>
        </div>

        <div class="header-actions">
          <div class="connection-status" id="dbBadge">
            <span class="status-dot"></span>
            연결 확인 중
          </div>
          <a class="docs-link" href="/docs" target="_blank" rel="noreferrer">API</a>
        </div>
      </header>

      <section class="chat-area" id="messages" aria-live="polite" aria-label="Agent 대화"></section>

      <section class="composer-area">
        <div class="suggestions" aria-label="추천 질문">
          <button data-question="정보문화관 장애인 화장실 어디 있어?">장애인 화장실 찾기</button>
          <button data-question="본관에서 정보문화관까지 휠체어로 가는 길">휠체어 경로 찾기</button>
          <button data-question="본관 엘리베이터 어디 있어?">엘리베이터 찾기</button>
          <button data-question="도서관 경사로 찾아줘">경사로 찾기</button>
        </div>

        <form id="chatForm" class="composer">
          <div class="composer-top">
            <button class="mode-button" id="modeButton" type="button" aria-haspopup="true">
              <span class="mode-icon">♿</span>
              <span id="modeLabel">휠체어</span>
              <span class="chevron">⌄</span>
            </button>
            <span class="composer-hint">Go-LeGo가 등록된 접근성 정보를 확인합니다</span>
          </div>
          <div class="composer-input-row">
            <input
              id="message"
              placeholder="어디로 가고 싶으신가요?"
              autocomplete="off"
              maxlength="200"
              aria-label="Agent에게 질문하기"
            >
            <button class="send-button" type="submit" aria-label="메시지 보내기">
              <span aria-hidden="true">↑</span>
            </button>
          </div>
        </form>
        <p class="footer-note">Go-LeGo Agent는 데이터에 없는 시설이나 경로를 임의로 생성하지 않습니다.</p>
      </section>
    </main>
  </div>

  <div class="mode-menu" id="modeMenu" hidden>
    <button data-mode="wheelchair" type="button">♿ 휠체어</button>
    <button data-mode="walking" type="button">🚶 일반 이동</button>
    <button data-mode="stroller" type="button">🛒 유모차</button>
    <button data-mode="senior" type="button">🧓 어르신</button>
  </div>

  <script src="/js/agent-ui.js"></script>
</body>
</html>
